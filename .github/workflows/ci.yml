name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y graphviz graphviz-dev

    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
    
    - name: Install dependencies
      run: uv sync
    
    - name: Run tests
      env:
        GOOGLE_MAPS_API_KEY_DEVELOPMENT: ${{ secrets.GOOGLE_MAPS_API_KEY_DEVELOPMENT }}
      run: uv run pytest