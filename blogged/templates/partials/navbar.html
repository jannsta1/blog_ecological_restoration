{% load static %}

<nav class="sticky top-0 left-0 right-0 m-2 bg-[var(--color-bg)] ">
  <div class="mx-auto px-2 sm:px-6 lg:px-8 border-2 rounded-3xl border-[var(--color-border)]">
    <div class="relative flex h-16 items-center justify-between">
      <div class="flex flex-1 items-center justify-start sm:items-stretch sm:justify-start">
        <div class="flex shrink-0 items-center">

          <a href="{% url 'landing_page' %}" class="px-2 py-2 rounded-xl navbar-content" data-url-name="landing_page">
            <img src="{% static 'images/leaf-vector.png' %}" alt="Jan's ecological restoration blog" class="h-8 w-auto" height="32" width="32" />
          </a>
        </div>

        <div class="hidden sm:ml-6 sm:block">
          <div class="flex space-x-4">
            <!-- Current: "bg-gray-900 text-white", Default: "text-gray-300 hover:bg-white/5 hover:text-white" -->
            <a href="{% url 'blog_listing' %}" aria-current="page" class="navbar-content" data-url-name="blog_listing">Blog Posts</a>
            <a href="{% url 'impact-map' %}" class="navbar-content" data-url-name="impact-map">Impact</a>
            <a href="{% url 'contact' %}" class="navbar-content" data-url-name="contact">Contact</a>
          </div>
        </div>
      </div>
      <div class="absolute inset-y-0 right-0 flex items-center pr-2 sm:static sm:inset-auto sm:ml-6 sm:pr-0">

        <!-- Profile dropdown -->
        <div class="flex flex-1 items-center justify-end sm:items-stretch sm:justify-end">
          <div class="flex space-x-4">
            {% if user.is_authenticated %}
              <a href="{% url 'upload-post' %}" class="navbar-content" data-url-name="upload-post">Upload Post</a>
            {% endif %}

            {% if user.is_authenticated %}
              <a
                href="#"
                class="navbar-content"
                data-url-name="logout"
                onClick="document.getElementById('logoutform').submit()"
              >Logout</a>
              <form id="logoutform" method="POST" action="{% url 'logout' %}">
                {% csrf_token %}
                <input type="hidden">
              </form>
            {% else %}
              <a href="{% url 'login' %}" class="navbar-content" data-url-name="login">Login</a>
            {% endif %}
          </div>
        </div>


          {% comment %} <a href="{% url 'success' %}">
            <button type="button" class="relative rounded-full p-1 text-gray-400 focus:outline-2 focus:outline-offset-2 focus:outline-indigo-500">
              <span class="sr-only">View notifications</span>
              <span class="absolute -inset-1.5"></span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" data-slot="icon" aria-hidden="true" class="size-6">
                <path d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </a> {% endcomment %}

        <div>
          <a href="{% url 'change-theme' %}" class="px-2 py-2 rounded-xl navbar-content" data-url-name="change-theme">
            {% if is_dark_theme %}
              <i class="fa-solid fa-lightbulb"></i>
            {% else %}
              <i class="fa-solid fa-moon"></i>
            {% endif %}
          </a>
        </div>
      </div>
    </div>
  </div>

</nav>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    var currentUrlName = "{{ request.resolver_match.url_name }}";
    if (currentUrlName) {
      var link = document.querySelector('a[data-url-name="' + currentUrlName + '"]');
      if (link) {
        link.classList.add('underline', 'decoration-solid', 'text-[var(--color-primary)]');
      }
    }
  });
</script>
