<!-- templates/contact.html -->
{% extends "base.html" %}

{% block title %}Contact{% endblock title %}

{% block content %}

  <div>
    <h1 class="text-center text-3xl mb-6 mt-2 font-semibold" data-testid="contact-title">Contact</h1>
  </div>

  <p class="text-center">Please use the form below to contact Jan.</p>

  <div class="flex justify-center">
    <form method="post" class="text-left space-y-4 w-full md:max-w-1/3" data-testid="contact-form">
      {% csrf_token %}
      {{ form }}
      <div class="form-actions">
        <button type="submit" class="btn-primary" data-testid="contact-submit">Send</button>
      </div>
    </form>
  </div>

{% endblock content %}
